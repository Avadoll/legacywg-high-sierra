name: Journal-bound PF rule generations

on:
  workflow_dispatch:
    inputs:
      fixture_only:
        description: Test standalone single-class real-policy prototype only
        type: boolean
        default: false
      coordinator_only:
        description: Test journal-bound Go singleton coordinator without legacy foreign fixture experiments
        type: boolean
        default: false
      packets_only:
        description: Test native owned-utun packet guard through durable Go coordinator
        type: boolean
        default: false
      encrypted_only:
        description: Test official encrypted WireGuard with native inner and synthetic outer PF paths
        type: boolean
        default: false
      transport_only:
        description: Test private socket lifetime controller and automatic encrypted transport
        type: boolean
        default: false
      scoped_only:
        description: Test scoped route loss during guarded transport admission and encrypted traffic
        type: boolean
        default: false
      routes_only:
        description: Test journal-bound endpoint host route ownership and actual crash recovery
        type: boolean
        default: false
      route_wire_only:
        description: Preflight typed host route codec on owned virtual interfaces without PF
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: legacywg-pf-rules${{ inputs.route_wire_only && '-wire' || '' }}
  cancel-in-progress: false

jobs:
  native-rules:
    runs-on: macos-15-intel
    timeout-minutes: 18
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      CGO_ENABLED: '0'
      GOOS: darwin
      GOARCH: amd64
      GOAMD64: v1
      LEGACYWG_PF_RULE_SCOPE: ${{ inputs.route_wire_only && 'route-wire' || inputs.routes_only && 'routes' || inputs.scoped_only && 'scoped' || inputs.transport_only && 'transport' || inputs.encrypted_only && 'encrypted' || inputs.packets_only && 'packets' || inputs.fixture_only && 'single-class' || inputs.coordinator_only && 'coordinator' || 'full' }}
    steps:
      - name: Check out reviewed rule coordinator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Verify pinned sources and native toolchain
        run: python3 Scripts/bootstrap_macos_ci.py
      - name: Verify native routing header offsets
        run: |
          mkdir -p Build/PFRules
          /usr/bin/xcrun clang -std=c11 -arch x86_64 -mmacosx-version-min=10.13 -Wall -Wextra -Werror Tests/RouteHeaderProbe.c -o Build/PFRules/route-header-probe
          ./Build/PFRules/route-header-probe
      - name: Measure actual typed rule generations and crash resolution
        run: python3 Scripts/test_pf_rules_macos.py
      - name: Save sanitized rule generation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: legacywg-pf-rules-${{ github.sha }}
          path: |
            Build/CI/pf-rules-ci.json
            Build/CI/pf-rules-tests.json
          if-no-files-found: error
          retention-days: 3
