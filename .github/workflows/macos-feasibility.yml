name: macOS feasibility build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacywg-feasibility
  cancel-in-progress: false

jobs:
  native-build:
    runs-on: macos-15-intel
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      CGO_ENABLED: '0'
      GOOS: darwin
      GOARCH: amd64
      GOAMD64: v1
    steps:
      - name: Check out pinned project revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Verify pinned source and toolchain
        run: python3 Scripts/bootstrap_macos_ci.py
      - name: Build native research engines
        run: |
          export LEGACYWG_GO="$PWD/.tools/go1.24.13/go/bin/go"
          bash Scripts/build_macos.sh
      - name: Build and test platform-check application
        run: python3 Scripts/build_platform_probe.py
      - name: Test native utun lifecycle on CI host
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          result = subprocess.run(['/usr/bin/sudo', '-n', './Build/Research/legacywg-native-smoke-darwin-amd64'], capture_output=True, text=True, timeout=20)
          output = pathlib.Path('Build/CI')
          output.mkdir(parents=True, exist_ok=True)
          (output / 'native-smoke-ci.json').write_text(result.stdout)
          (output / 'native-smoke-ci-stderr.txt').write_text(result.stderr)
          if result.returncode != 0:
              raise SystemExit(result.returncode)
          report = json.loads(result.stdout)
          if report.get('status') != 'PASS':
              raise SystemExit('Native probe did not report PASS')
          PY
      - name: Build limited native VPN client and research installer
        run: python3 Scripts/build_client_macos.py
      - name: Test real client helper and encrypted peer
        run: python3 Scripts/test_mach_auth_macos.py
      - name: Upload research app and actual CI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: legacywg-platform-probe-${{ github.sha }}
          path: |
            Build/CI/*.zip
            Build/CI/*.dmg
            Build/CI/*.pkg
            Build/CI/*.json
            Build/CI/*.txt
            Docs/Evidence/Mac/
          if-no-files-found: error
          retention-days: 3
